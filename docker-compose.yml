services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: myapp_user
      POSTGRES_PASSWORD: localdev
      POSTGRES_HOST_AUTH_METHOD: trust  # Required on Windows — Docker Desktop routes connections through a bridge network, breaking scram-sha-256 auth. Local dev only, never used in production.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp_user -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      # Override POSTGRES_HOST_PORT in .env when a native PostgreSQL service already
      # owns 5432 (common on Windows). Beats stopping the machine's own database.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
