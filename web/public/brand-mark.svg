<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TCG Investments</title>
  <desc id="desc">Three trading cards fanned out of a hand.</desc>
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".38" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc4ff"/>
      <stop offset="1" stop-color="#1d7fd4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0a0e1a"/>
  <g transform="translate(256 256)">
    <rect x="-79.5" y="-105" width="159" height="210" rx="10" fill="#ffcb05" fill-opacity=".85"
      transform="translate(-48) rotate(-16)"/>
    <rect x="-79.5" y="-105" width="159" height="210" rx="10" fill="#a55eea" fill-opacity=".85"
      transform="translate(48) rotate(16)"/>
    <rect x="-79.5" y="-105" width="159" height="210" rx="10" fill="url(#blue)" filter="url(#glow)"/>
    <rect x="-79.5" y="-105" width="159" height="210" rx="10" fill="url(#front)"/>
  </g>
</svg>
