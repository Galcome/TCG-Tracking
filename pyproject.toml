[project]
name = "production-projects"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.16.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "PyJWT>=2.15.0",
    "cryptography>=50.0.2",
    "sentry-sdk[fastapi]>=2.72.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.4",
    "hypothesis>=6.170.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/__init__.py",
    "src/database.py",  # Infrastructure: requires live DB, covered by integration tests.
]

[tool.coverage.report]
fail_under = 100
show_missing = true
