[project]
name = "production-projects"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "PyJWT>=2.8.0",
    "cryptography>=50.0.0",
    "sentry-sdk[fastapi]>=2.68.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.3",
    "hypothesis>=6.165.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/__init__.py",
    "src/database.py",  # Infrastructure: requires live DB, covered by integration tests.
]

[tool.coverage.report]
fail_under = 100
show_missing = true
