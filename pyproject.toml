[project]
name = "production-projects"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.3.0",
    "psycopg[binary]>=3.1.19",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.1",
    "hypothesis>=6.161.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/__init__.py",
    "src/database.py",  # Infrastructure: requires live DB, covered by integration tests.
]

[tool.coverage.report]
fail_under = 100
show_missing = true
