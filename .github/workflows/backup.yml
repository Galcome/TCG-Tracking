name: Backup

# Nightly, and on demand when a risky migration is about to ship. Deliberately
# outside CI: a backup that only runs when someone pushes code is not a backup.
on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC, a quiet hour, off the hour to dodge the rush
  workflow_dispatch:
    inputs:
      verify:
        description: "Also restore into a scratch database and verify"
        type: boolean
        default: false

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted dump to R2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # R2 ignores the region but the AWS CLI refuses to start without one.
      AWS_DEFAULT_REGION: auto
      # R2 rejects the newer default checksum headers the CLI sends.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Match the client major to the source server rather than taking the newest.
      # pg_dump refuses a server newer than itself, and a newer pg_dump writes
      # statements an older server rejects on the way back in - an 18 client emits
      # `SET transaction_timeout`, which a 16 server fails on during restore.
      # Dumping with the server's own major avoids both ends of that.
      - name: Install the matching postgresql-client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          # The preinstalled psql only has to connect, not dump, so whatever major
          # ships on the runner can answer this.
          major="$(psql "$BACKUP_DATABASE_URL" -tAc "SELECT current_setting('server_version_num')::int / 10000")"
          echo "Source server is PostgreSQL $major"
          sudo apt-get install -y --no-install-recommends "postgresql-client-$major"
          # /usr/bin/pg_dump is pg_wrapper, which picks a version of its own accord and
          # picked the runner's preinstalled 16 even with 18 installed alongside. Put the
          # versioned directory first so the client we just chose is the one that runs.
          echo "/usr/lib/postgresql/$major/bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/$major/bin/pg_dump" --version

      - name: Back up
        run: ./scripts/backup-database.sh

  verify:
    name: Restore drill
    needs: backup
    # Only when asked. A nightly restore would need a scratch database standing by
    # every night, which is cost for its own sake - but the drill must be one click
    # away, or it never happens.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      scratch:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: scratch
          POSTGRES_DB: scratch
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      # Present only so the script's "not the source database" guard can fire.
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # A disposable container on the runner, and the newest major so nothing the
      # restore emits can be rejected by it.
      RESTORE_TARGET_URL: postgresql://postgres:scratch@localhost:5432/scratch

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Newest client here on purpose: pg_restore reads archives from its own major
      # and older, and the scratch service above is that same major.
      - name: Install a current postgresql-client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          # Same wrapper problem as the backup job: name the directory explicitly.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          "/usr/lib/postgresql/18/bin/pg_restore" --version

      - name: Restore and verify
        run: ./scripts/restore-backup.sh
