name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_ROLE: test
      DEBUG: "false"
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      DIRECT_DATABASE_URL: ""
      FIREBASE_PROJECT_ID: test-firebase-project
      ALLOWED_MEMBER_EMAILS: ""
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      ALLOWED_ORIGIN_REGEX: ""
      SENTRY_DSN: ""
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-flash-lite-latest
      GROQ_API_KEY: ""
      GROQ_MODEL: qwen/qwen3.8-27b
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_MODEL: claude-haiku-4-5-20251001
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-5.6-luna
      VISION_DAILY_FRAME_LIMIT: "400"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=100

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    env:
      # Placeholders only - this job proves the bundle compiles, it does not publish it.
      # The real values live in repository variables and are used by `deploy-web` below.
      # VITE_* are baked in at build time, so a bundle built here must never be deployed.
      VITE_API_URL: https://api.example.invalid
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-placeholder
      VITE_SENTRY_DSN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_ROLE: test
      DEBUG: "false"
      # The suite runs against test_db_e2e, which tests/e2e/prepare.py creates from this.
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      DIRECT_DATABASE_URL: ""
      FIREBASE_PROJECT_ID: test-firebase-project
      ALLOWED_MEMBER_EMAILS: ""
      ALLOWED_ORIGINS: http://127.0.0.1:5273
      ALLOWED_ORIGIN_REGEX: ""
      SENTRY_DSN: ""
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-flash-lite-latest
      GROQ_API_KEY: ""
      GROQ_MODEL: qwen/qwen3.8-27b
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_MODEL: claude-haiku-4-5-20251001
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-5.6-luna
      VISION_DAILY_FRAME_LIMIT: "400"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run end-to-end tests
        run: npm run test:e2e
        working-directory: web

      # The trace is the only way to see why a browser test failed on a machine you
      # cannot open.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  tests-required:
    name: All Tests Required
    runs-on: ubuntu-latest
    needs: [backend-tests, web-build, e2e]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "Backend tests failed"
            exit 1
          fi
          if [ "${{ needs.web-build.result }}" != "success" ]; then
            echo "Web build failed"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "End-to-end tests failed"
            exit 1
          fi
          echo "All checks passed"
