name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_ROLE: test
      DEBUG: "false"
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      DIRECT_DATABASE_URL: ""
      FIREBASE_PROJECT_ID: test-firebase-project
      ALLOWED_MEMBER_EMAILS: ""
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      ALLOWED_ORIGIN_REGEX: ""
      SENTRY_DSN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=100

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    env:
      # Placeholders only. Real values come from the Cloudflare Pages build settings;
      # these just keep the bundle from embedding "undefined".
      VITE_API_URL: https://api.example.invalid
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-placeholder
      VITE_SENTRY_DSN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_ROLE: test
      DEBUG: "false"
      # The suite runs against test_db_e2e, which tests/e2e/prepare.py creates from this.
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      DIRECT_DATABASE_URL: ""
      FIREBASE_PROJECT_ID: test-firebase-project
      ALLOWED_MEMBER_EMAILS: ""
      ALLOWED_ORIGINS: http://127.0.0.1:5273
      ALLOWED_ORIGIN_REGEX: ""
      SENTRY_DSN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run end-to-end tests
        run: npm run test:e2e
        working-directory: web

      # The trace is the only way to see why a browser test failed on a machine you
      # cannot open.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  tests-required:
    name: All Tests Required
    runs-on: ubuntu-latest
    needs: [backend-tests, web-build, e2e]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "Backend tests failed"
            exit 1
          fi
          if [ "${{ needs.web-build.result }}" != "success" ]; then
            echo "Web build failed"
            exit 1
          fi
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "End-to-end tests failed"
            exit 1
          fi
          echo "All checks passed"
