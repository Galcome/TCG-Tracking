name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_ROLE: test
      DEBUG: "false"
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      DIRECT_DATABASE_URL: ""
      FIREBASE_PROJECT_ID: test-firebase-project
      ALLOWED_MEMBER_EMAILS: ""
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      ALLOWED_ORIGIN_REGEX: ""
      SENTRY_DSN: ""
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-flash-lite-latest
      GROQ_API_KEY: ""
      GROQ_MODEL: qwen/qwen3.8-27b
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_MODEL: claude-haiku-4-5-20251001
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-5.6-luna
      VISION_DAILY_FRAME_LIMIT: "400"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=100

  tests-required:
    name: All Tests Required
    runs-on: ubuntu-latest
    needs: [backend-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "Backend tests failed"
            exit 1
          fi
          echo "All checks passed"
