name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      APP_ROLE: test
      DEBUG: "false"
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      DIRECT_DATABASE_URL: ""
      DIRECT_DB_PASSWORD: ""
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "2"
      DB_POOL_TIMEOUT_SECONDS: "15"
      DB_POOL_RECYCLE_SECONDS: "270"
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_JWT_SECRET: test-supabase-jwt-secret-for-local-testing
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
      ALLOWED_ORIGIN_REGEX: ""
      SENTRY_DSN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=100

  tests-required:
    name: All Tests Required
    runs-on: ubuntu-latest
    needs: [backend-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            echo "Backend tests failed"
            exit 1
          fi
          echo "All tests passed"
