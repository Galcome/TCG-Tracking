name: Expo app

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    paths: ["app/**", "src/**", "tests/e2e/**", "migrations/**", "uv.lock", "firebase.json", ".github/workflows/expo-checks.yml"]
  push:
    # Always validate exact protected-branch commits, including docs-only merges,
    # so a future exact-main mobile release gate can find an authoritative result.
    branches: [main, dev]

concurrency:
  group: expo-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  expo:
    name: Expo checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: app
    env:
      CI: "1"
      APP_ENV: test
      APP_ROLE: test
      DATABASE_URL: postgresql+psycopg://test_user:test_password@127.0.0.1:5432/test_db
      E2E_DATABASE_URL: postgresql+psycopg://test_user:test_password@127.0.0.1:5432/test_db_e2e
      DIRECT_DATABASE_URL: ""
      FIREBASE_PROJECT_ID: test-firebase-project
      ALLOWED_MEMBER_EMAILS: ""
      SENTRY_DSN: ""
      # Compilation fixtures only. Never upload these bundles for distribution.
      EXPO_PUBLIC_API_URL: http://127.0.0.1:8101
      EXPO_PUBLIC_FIREBASE_API_KEY: e2e-public-placeholder
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: test-firebase-project.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: test-firebase-project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - run: uv sync --all-groups --frozen
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=line
      - run: npx expo export --platform android --platform ios --output-dir dist-native --clear --max-workers 2
      - name: Failure evidence (test fixtures only)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expo-test-failures
          path: app/test-results/
          retention-days: 7

  deploy-web:
    name: Deploy web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The web app is the Expo export, so the gate is the Expo suite that just ran: lint,
    # typecheck, unit tests and the Playwright run that drives this exact bundle in a
    # browser. Only a real push to main deploys; pull requests build nothing.
    needs: [expo]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read

    environment:
      name: production
      url: https://tcg-tracking.web.app

    defaults:
      run:
        working-directory: app

    env:
      # Repository *variables*, not secrets: every EXPO_PUBLIC_* value is compiled into
      # the bundle and served to the browser, so treating them as secret would be theatre.
      # Still named VITE_* because the retired Vite site owned them first; the values are
      # identical - same API, same Firebase project. Renaming is a repo-variable change.
      EXPO_PUBLIC_API_URL: ${{ vars.VITE_API_URL }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      # app/.env is a developer's localhost file. A release must never read it.
      EXPO_NO_DOTENV: "1"
      CI: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # An unset variable becomes an empty string and Metro compiles it happily, producing
      # a bundle that fails at runtime for reasons nobody can see. Fail here instead.
      - name: Require the production values
        run: |
          missing=""
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_FIREBASE_API_KEY \
                      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN EXPO_PUBLIC_FIREBASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            echo "::error::Set them under Settings -> Secrets and variables -> Actions -> Variables."
            echo "::error::They must be Variables, not Secrets - this job reads vars.*"
            exit 1
          fi

      - name: Build
        run: npm run export:web

      # The exact mistake this guard exists to prevent: a bundle built from a localhost
      # env that silently talks to nothing once it is live.
      - name: Refuse to publish a bundle that talks to localhost
        run: |
          if grep -rlq '127\.0\.0\.1:8001\|localhost:8000' dist/_expo/ 2>/dev/null; then
            echo "::error::The bundle contains a localhost API - EXPO_PUBLIC_API_URL did not take effect."
            exit 1
          fi
          if ! grep -rlq -- "$EXPO_PUBLIC_API_URL" dist/_expo/ 2>/dev/null; then
            echo "::error::The bundle does not contain $EXPO_PUBLIC_API_URL."
            exit 1
          fi

      # `entryPoint` is the repo root on purpose: firebase.json lives there and points at
      # app/dist. channelId `live` is the real site rather than a preview channel.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TCG_TRACKING }}
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
